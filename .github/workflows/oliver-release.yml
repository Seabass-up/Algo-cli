name: Read-only draft visibility diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  visibility:
    if: github.repository == 'Seabass-up/Algo-cli' && github.actor_id == '184999458' && github.ref == 'refs/heads/diagnose/draft-read-permissions'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Inspect fixed draft endpoints without publishing or exposing bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -B -S - <<'PY'
          import json, os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          for endpoint in ('releases?per_page=100', 'releases/385866827', 'releases/385866827/assets?per_page=100'):
              request = urllib.request.Request('https://api.github.com/repos/Seabass-up/Algo-cli/' + endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10',
              }, method='GET')
              try:
                  with opener.open(request, timeout=20) as response:
                      status, body = response.status, response.read(8388609)
                  assert len(body) <= 8388608
                  value = json.loads(body)
                  result = {'endpoint': endpoint, 'http_status': status}
                  if endpoint.startswith('releases?'):
                      result.update(count=len(value), matched=sum(r.get('id') == 385866827 for r in value))
                  elif isinstance(value, dict):
                      result.update(id=value.get('id'), draft=value.get('draft'), tag=value.get('tag_name'))
                  else:
                      result['count'] = len(value)
              except urllib.error.HTTPError as error:
                  result = {'endpoint': endpoint, 'http_status': error.code}
              print(json.dumps(result, sort_keys=True))
          PY
